<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: shell(${title}, ${active}, ~{::section})}">
<body>
<section>
    <h3 class="mb-3">Reports</h3>
    <p class="text-muted">Every report is built by reporting-service from live data and can be downloaded as CSV.</p>
    <div class="list-group" style="max-width: 640px;">
        <a class="list-group-item list-group-item-action" th:each="t : ${types}" th:href="@{'/reports/' + ${t.key}}">
            <span class="fw-semibold" th:text="${t.value}">Report</span>
        </a>
    </div>
</section>
</body>
</html>
