<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: shell(${title}, ${active}, ~{::section})}">
<body>
<section>
    <div class="mb-2">&laquo; <a th:href="@{/distribution}">All plans</a></div>
    <h3>New distribution plan</h3>

    <div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div>
    <div class="alert alert-info" th:if="${info}" th:text="${info}"></div>

    <form method="post" th:action="@{/distribution/plans/preview}" style="max-width: 820px;">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Programme</label>
                <select class="form-select" name="programmeId" required>
                    <option th:each="o : ${programmeOptions}" th:value="${o.value()}" th:text="${o.label()}"
                            th:selected="${o.value() == v['programmeId']}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Distribution centre</label>
                <select class="form-select" name="centreId" required>
                    <option th:each="o : ${centreOptions}" th:value="${o.value()}" th:text="${o.label()}"
                            th:selected="${o.value() == v['centreId']}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">From</label>
                <input class="form-control" type="date" name="startDate" th:value="${v['startDate']}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">To</label>
                <input class="form-control" type="date" name="endDate" th:value="${v['endDate']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Remarks</label>
                <input class="form-control" name="remarks" th:value="${v['remarks']}">
            </div>
        </div>
        <div class="mt-3 d-flex flex-wrap gap-2">
            <button class="btn btn-outline-primary" type="submit">1. Preview requirements</button>
            <button class="btn btn-primary" type="submit" th:formaction="@{/distribution/plans/create}">2. Create plan and reserve stock</button>
            <button class="btn btn-outline-warning" type="submit" th:formaction="@{/distribution/plans/raise-procurement}">Raise procurement for shortage</button>
        </div>
    </form>

    <div class="mt-4" th:each="s : ${sections}">
        <h6 class="text-uppercase text-muted" th:text="${s.title()}">Section</h6>
        <table class="table table-sm table-bordered bg-white w-auto" th:if="${s.pairs() != null}">
            <tbody>
            <tr th:each="p : ${s.pairs()}"><th th:text="${p[0]}">Label</th><td th:text="${p[1]}"></td></tr>
            </tbody>
        </table>
        <div class="table-responsive" th:if="${s.columns() != null}">
            <table class="table table-sm table-bordered bg-white align-middle">
                <thead><tr><th th:each="c : ${s.columns()}" th:text="${@ui.pretty(c)}">Col</th></tr></thead>
                <tbody>
                <tr th:each="row : ${s.rows()}"><td th:each="x : ${row}" th:text="${x}"></td></tr>
                <tr th:if="${#lists.isEmpty(s.rows())}"><td th:colspan="${#lists.size(s.columns())}" class="text-muted text-center">None.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
