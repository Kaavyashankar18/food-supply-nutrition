<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Service unavailable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container text-center py-5">
    <i class="bi bi-plug display-1 text-warning"></i>
    <h2 class="mt-3" th:text="${title}">Service unavailable</h2>
    <p class="lead" th:text="${message}">A backend service did not answer.</p>
    <a class="btn btn-outline-secondary me-2" href="javascript:history.back()"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house me-1"></i>Dashboard</a>
</div>
</body>
</html>
