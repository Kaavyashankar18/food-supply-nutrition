<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: shell(${title}, ${active}, ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0" th:text="${title}">Title</h3>
        <a th:if="${addUrl != null}" class="btn btn-primary btn-sm" th:href="@{${addUrl}}" th:text="${addLabel}">Add</a>
    </div>

    <ul class="nav nav-tabs mb-3" th:if="${!#lists.isEmpty(tabs)}">
        <li class="nav-item" th:each="t : ${tabs}">
            <a class="nav-link" th:classappend="${t.active()} ? 'active'" th:href="@{${t.url()}}" th:text="${t.label()}">Tab</a>
        </li>
    </ul>

    <div class="row g-3 mb-3" th:if="${!#lists.isEmpty(cards)}">
        <div class="col-6 col-md-3 col-xl-2" th:each="c : ${cards}">
            <div class="box h-100">
                <div class="num" th:text="${c.value()}">0</div>
                <div class="lbl" th:text="${c.label()}">Label</div>
            </div>
        </div>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{${filterUrl}}" th:if="${!#lists.isEmpty(filters)}">
        <div class="col-md-2" th:each="f : ${filters}">
            <select class="form-select form-select-sm" th:if="${f.type() == 'select'}" th:name="${f.name()}">
                <option th:each="o : ${f.options()}" th:value="${o.value()}" th:text="${o.label()}"
                        th:selected="${o.value() == f.value()}"></option>
            </select>
            <input class="form-control form-control-sm" th:unless="${f.type() == 'select'}"
                   th:type="${f.type() == 'date' ? 'date' : 'text'}" th:name="${f.name()}"
                   th:value="${f.value()}" th:placeholder="${f.label()}" th:title="${f.label()}">
        </div>
        <div class="col-auto">
            <button class="btn btn-sm btn-secondary" type="submit">Filter</button>
            <a class="btn btn-sm btn-link" th:href="@{${filterUrl}}">Clear</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-sm table-bordered align-middle bg-white">
            <thead>
            <tr>
                <th th:each="c : ${columns}" th:text="${@ui.pretty(c)}">Column</th>
                <th th:if="${linkBase != null}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td th:each="c : ${columns}">
                    <span th:if="${@ui.badge(r.get(c)) != ''}" class="badge"
                          th:classappend="'text-bg-' + ${@ui.badge(r.get(c))}" th:text="${r.get(c)}"></span>
                    <span th:unless="${@ui.badge(r.get(c)) != ''}" th:text="${@ui.cell(r.get(c))}"></span>
                </td>
                <td th:if="${linkBase != null}">
                    <a th:href="@{${linkBase + '/' + r.get(linkKey)}}">Open</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}">
                <td th:colspan="${#lists.size(columns) + 1}" class="text-center text-muted">Nothing found.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{layout/fragments :: pager(${page}, ${base})}"></div>
</section>
</body>
</html>
