<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: shell(${title}, ${active}, ~{::section})}">
<body>
<section>
    <div class="mb-2" th:if="${backUrl != null}">&laquo; <a th:href="@{${backUrl}}" th:text="${backLabel}">Back</a></div>
    <h3 th:text="${title}">Title</h3>

    <ul class="nav nav-tabs mb-3" th:if="${!#lists.isEmpty(tabs)}">
        <li class="nav-item" th:each="t : ${tabs}">
            <a class="nav-link" th:classappend="${t.active()} ? 'active'" th:href="@{${t.url()}}" th:text="${t.label()}">Tab</a>
        </li>
    </ul>

    <form class="row g-2 mb-3" method="get" th:if="${rangeUrl != null}" th:action="@{${rangeUrl}}">
        <div class="col-auto"><input class="form-control form-control-sm" type="date" name="from" th:value="${rangeFrom}"></div>
        <div class="col-auto"><input class="form-control form-control-sm" type="date" name="to" th:value="${rangeTo}"></div>
        <div class="col-auto"><button class="btn btn-sm btn-secondary" type="submit">Recalculate</button></div>
    </form>

    <div class="d-flex flex-wrap gap-2 mb-3" th:if="${!#lists.isEmpty(actions)}">
        <th:block th:each="a : ${actions}">
            <a th:unless="${a.post()}" class="btn btn-sm" th:classappend="'btn-' + ${a.style()}"
               th:href="@{${a.url()}}" th:text="${a.label()}">Link</a>
            <form th:if="${a.post()}" th:action="@{${a.url()}}" method="post" class="m-0" th:attr="data-confirm=${a.confirm()}">
                <button class="btn btn-sm" th:classappend="'btn-' + ${a.style()}" type="submit" th:text="${a.label()}">Go</button>
            </form>
        </th:block>
    </div>

    <div th:each="s : ${sections}" class="mb-4">
        <h6 class="text-uppercase text-muted" th:text="${s.title()}">Section</h6>
        <table class="table table-sm table-bordered bg-white w-auto" th:if="${s.pairs() != null}">
            <tbody>
            <tr th:each="p : ${s.pairs()}">
                <th th:text="${p[0]}">Label</th>
                <td>
                    <span th:if="${@ui.badge(p[1]) != ''}" class="badge" th:classappend="'text-bg-' + ${@ui.badge(p[1])}" th:text="${p[1]}"></span>
                    <span th:unless="${@ui.badge(p[1]) != ''}" th:text="${p[1]}"></span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="table-responsive" th:if="${s.columns() != null}">
            <table class="table table-sm table-bordered bg-white align-middle">
                <thead><tr><th th:each="c : ${s.columns()}" th:text="${@ui.pretty(c)}">Col</th></tr></thead>
                <tbody>
                <tr th:each="row : ${s.rows()}">
                    <td th:each="v : ${row}">
                        <span th:if="${@ui.badge(v) != ''}" class="badge" th:classappend="'text-bg-' + ${@ui.badge(v)}" th:text="${v}"></span>
                        <span th:unless="${@ui.badge(v) != ''}" th:text="${v}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(s.rows())}"><td th:colspan="${#lists.size(s.columns())}" class="text-muted text-center">None.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.querySelectorAll('form[data-confirm]').forEach(function (f) {
            f.addEventListener('submit', function (e) {
                if (!confirm(f.getAttribute('data-confirm'))) { e.preventDefault(); }
            });
        });
    </script>
</section>
</body>
</html>
