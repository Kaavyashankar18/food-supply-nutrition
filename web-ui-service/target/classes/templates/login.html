<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Food Supply &amp; Nutrition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="text-center text-white mb-4">
                <i class="bi bi-basket3-fill display-4"></i>
                <h4 class="mt-2 mb-0">Food Supply &amp; Nutrition</h4>
                <div class="small opacity-75">Integrated Management System</div>
            </div>
            <div class="card shadow">
                <div class="card-body p-4">
                    <h5 class="mb-3">Sign in</h5>
                    <div class="alert alert-danger py-2" th:if="${param.error}">Invalid username or password.</div>
                    <div class="alert alert-success py-2" th:if="${param.logout}">You have been logged out.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" id="username" name="username" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </button>
                    </form>
                </div>
                <div class="card-footer small text-muted">
                    Demo users: admin, store, procure, field (password: &lt;username&gt;123)
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
