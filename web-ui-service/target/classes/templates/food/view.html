<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: shell('Food item', 'food', ~{::section})}">
<body>
<section>
    <div class="mb-2"><a th:href="@{/food}">&laquo; All food items</a></div>
    <h3 th:text="${f['name']}">Name</h3>

    <div class="d-flex gap-2 mb-3" sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER')">
        <a class="btn btn-sm btn-outline-primary" th:href="@{/food/{id}/edit(id=${f['id']})}">Edit</a>
        <form th:action="@{/food/{id}/active(id=${f['id']})}" method="post" class="m-0">
            <input type="hidden" name="value" th:value="${f['active'] == true} ? 'false' : 'true'">
            <button class="btn btn-sm btn-outline-secondary" type="submit"
                    th:text="${f['active'] == true} ? 'Deactivate' : 'Activate'">Toggle</button>
        </form>
    </div>

    <table class="table table-sm table-bordered w-auto bg-white">
        <tbody>
        <tr><th>Category</th><td th:text="${f['categoryName']}"></td></tr>
        <tr><th>Unit</th><td th:text="${f['unit']}"></td></tr>
        <tr><th>Grams per unit</th><td th:text="${f['gramsPerUnit']}"></td></tr>
        <tr><th>Calories per 100 g</th><td th:text="${f['caloriesPer100g']}"></td></tr>
        <tr><th>Protein per 100 g</th><td th:text="${f['proteinPer100g']}"></td></tr>
        <tr><th>Carbs per 100 g</th><td th:text="${f['carbsPer100g']}"></td></tr>
        <tr><th>Fat per 100 g</th><td th:text="${f['fatPer100g']}"></td></tr>
        <tr><th>Fibre per 100 g</th><td th:text="${f['fibrePer100g']}"></td></tr>
        <tr><th>Allergens</th><td th:text="${f['allergens']}"></td></tr>
        <tr><th>Storage</th><td th:text="${f['storageRequirement']}"></td></tr>
        <tr><th>Recommended per person per day</th><td th:text="${f['recommendedQtyPerPersonPerDay']}"></td></tr>
        <tr><th>Active</th><td th:text="${f['active'] == true} ? 'Yes' : 'No'"></td></tr>
        </tbody>
    </table>
</section>
</body>
</html>
