<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: shell('Food items', 'food', ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Food items</h3>
        <div sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER')">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/food/categories}">Categories</a>
            <a class="btn btn-primary btn-sm" th:href="@{/food/new}">Add item</a>
        </div>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/food}">
        <div class="col-md-3">
            <input class="form-control form-control-sm" name="q" th:value="${q}" placeholder="Search by name">
        </div>
        <div class="col-md-2">
            <select class="form-select form-select-sm" name="categoryId">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c['id']}" th:text="${c['name']}"
                        th:selected="${categoryId != null and categoryId == c['id'].toString()}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select form-select-sm" name="unit">
                <option value="">Any unit</option>
                <option th:each="u : ${units}" th:value="${u}" th:text="${u}" th:selected="${u == unit}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select form-select-sm" name="active">
                <option value="">Active and inactive</option>
                <option value="true" th:selected="${active == 'true'}">Active only</option>
                <option value="false" th:selected="${active == 'false'}">Inactive only</option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-sm btn-secondary" type="submit">Filter</button>
            <a class="btn btn-sm btn-link" th:href="@{/food}">Clear</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-sm table-bordered align-middle">
            <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Category</th><th>Unit</th><th>Calories/100g</th>
                <th>Protein/100g</th><th>Per person per day</th><th>Active</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td th:text="${r['id']}"></td>
                <td th:text="${r['name']}"></td>
                <td th:text="${r['categoryName']}"></td>
                <td th:text="${r['unit']}"></td>
                <td th:text="${r['caloriesPer100g']}"></td>
                <td th:text="${r['proteinPer100g']}"></td>
                <td th:text="${r['recommendedQtyPerPersonPerDay']}"></td>
                <td th:text="${r['active'] == true} ? 'Yes' : 'No'"></td>
                <td><a th:href="@{/food/{id}(id=${r['id']})}">Open</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9" class="text-center text-muted">Nothing found.</td></tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{layout/fragments :: pager(${page}, ${base})}"></div>
</section>
</body>
</html>
