<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: shell('Beneficiary form', 'beneficiary', ~{::section})}">
<body>
<section>
    <div class="mb-2"><a th:href="@{/beneficiary}">&laquo; All beneficiaries</a></div>
    <h3 th:text="${b['id'] == null} ? 'New beneficiary' : 'Edit beneficiary'">Beneficiary</h3>

    <div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div>

    <form th:action="@{/beneficiary/save}" method="post" style="max-width: 760px;">
        <input type="hidden" name="id" th:value="${b['id']}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Full name</label>
                <input class="form-control" name="fullName" th:value="${b['fullName']}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="ACTIVE" th:selected="${b['status'] != 'INACTIVE'}">ACTIVE</option>
                    <option value="INACTIVE" th:selected="${b['status'] == 'INACTIVE'}">INACTIVE</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Type</label>
                <select class="form-select" name="type">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == b['type']}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Category</label>
                <select class="form-select" name="category">
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == b['category']}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">People served</label>
                <input class="form-control" type="number" min="1" name="peopleServed" th:value="${b['peopleServed']}" placeholder="1 for individuals">
            </div>
            <div class="col-md-4">
                <label class="form-label">Age (individuals)</label>
                <input class="form-control" type="number" min="0" name="age" th:value="${b['age']}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Gender (individuals)</label>
                <select class="form-select" name="gender">
                    <option value="">-</option>
                    <option th:each="g : ${genders}" th:value="${g}" th:text="${g}" th:selected="${g == b['gender']}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Household size</label>
                <input class="form-control" type="number" min="1" name="householdSize" th:value="${b['householdSize']}">
            </div>
            <div class="col-md-8">
                <label class="form-label">Address</label>
                <input class="form-control" name="address" th:value="${b['address']}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Contact number</label>
                <input class="form-control" name="contactNumber" th:value="${b['contactNumber']}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Health condition</label>
                <input class="form-control" name="healthCondition" th:value="${b['healthCondition']}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Dietary preference</label>
                <input class="form-control" name="dietaryPreference" th:value="${b['dietaryPreference']}">
            </div>
            <div class="col-12">
                <label class="form-label">Dietary restrictions</label>
                <input class="form-control" name="dietaryRestrictions" th:value="${b['dietaryRestrictions']}">
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-link" th:href="@{/beneficiary}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
