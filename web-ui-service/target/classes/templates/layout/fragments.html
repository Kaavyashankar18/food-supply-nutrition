<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Previous / next links. "base" is the list url including any filters. -->
<div th:fragment="pager(page, base)" th:if="${page != null}" class="d-flex align-items-center gap-3 small mt-2">
    <span th:text="${page['totalElements']} + ' records, page ' + (${page['page']} + 1) + ' of ' + (${page['totalPages']} == 0 ? 1 : ${page['totalPages']})"></span>
    <a class="btn btn-sm btn-outline-secondary" th:classappend="${page['page'] == 0} ? 'disabled'"
       th:href="@{${base}(page=${page['page'] - 1})}">Previous</a>
    <a class="btn btn-sm btn-outline-secondary" th:classappend="${page['page'] + 1 >= page['totalPages']} ? 'disabled'"
       th:href="@{${base}(page=${page['page'] + 1})}">Next</a>
</div>

</body>
</html>
