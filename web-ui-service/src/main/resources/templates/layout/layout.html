<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="shell(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Food Supply and Nutrition'">Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<div class="topbar">
    <div>
        <button class="btn btn-sm btn-outline-light d-lg-none me-2" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar">Menu</button>
        <a th:href="@{/}">Food Supply and Nutrition</a>
    </div>
    <div class="d-flex align-items-center">
        <span class="me-3 small">
            <span sec:authentication="name">user</span>
            (<span th:text="${#authentication.authorities[0].authority.replace('ROLE_', '').replace('_', ' ').toLowerCase()}">role</span>)
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="sidebar">
    <div class="offcanvas-header d-lg-none">
        <h6 class="offcanvas-title">Menu</h6>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
    </div>
    <div class="offcanvas-body d-block p-0">
        <ul class="nav flex-column py-2">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/}">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'demo'} ? 'active'" th:href="@{/demo}">Demo walkthrough</a>
            </li>
            <li class="nav-heading">Masters</li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','FIELD_OFFICER')">
                <a class="nav-link" th:classappend="${active == 'beneficiary'} ? 'active'" th:href="@{/beneficiary}">Beneficiaries</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'food'} ? 'active'" th:href="@{/food}">Food items</a>
            </li>
            <li class="nav-heading">Operations</li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','PROCUREMENT_OFFICER','STORE_MANAGER')">
                <a class="nav-link" th:classappend="${active == 'procurement'} ? 'active'" th:href="@{/procurement}">Procurement</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER','PROCUREMENT_OFFICER')">
                <a class="nav-link" th:classappend="${active == 'inventory'} ? 'active'" th:href="@{/inventory}">Inventory</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','FIELD_OFFICER','STORE_MANAGER')">
                <a class="nav-link" th:classappend="${active == 'programme'} ? 'active'" th:href="@{/programme}">Programmes</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER','FIELD_OFFICER')">
                <a class="nav-link" th:classappend="${active == 'distribution'} ? 'active'" th:href="@{/distribution}">Distribution</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER')">
                <a class="nav-link" th:classappend="${active == 'quality'} ? 'active'" th:href="@{/quality}">Quality and wastage</a>
            </li>
            <li class="nav-heading" sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER','PROCUREMENT_OFFICER')">Reports</li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STORE_MANAGER','PROCUREMENT_OFFICER')">
                <a class="nav-link" th:classappend="${active == 'reports'} ? 'active'" th:href="@{/reports}">Reports</a>
            </li>
        </ul>
    </div>
</div>

<main class="content">
    <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${flashSuccess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${flashError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <th:block th:replace="${content}"></th:block>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</body>
</html>
