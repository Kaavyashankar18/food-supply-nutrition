<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container text-center py-5">
    <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
    <h1 class="mt-3">Something went wrong</h1>
    <p class="lead">An unexpected error occurred. Please try again.</p>
    <p class="text-muted small" th:if="${message}" th:text="${message}"></p>
    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house me-1"></i>Back to dashboard</a>
</div>
</body>
</html>
