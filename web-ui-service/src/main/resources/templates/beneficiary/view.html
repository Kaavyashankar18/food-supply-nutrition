<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: shell('Beneficiary', 'beneficiary', ~{::section})}">
<body>
<section>
    <div class="mb-2"><a th:href="@{/beneficiary}">&laquo; All beneficiaries</a></div>
    <h3 th:text="${b['fullName']}">Name</h3>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <a class="btn btn-sm btn-outline-primary" th:href="@{/beneficiary/{id}/edit(id=${b['id']})}">Edit</a>
        <form th:action="@{/beneficiary/{id}/verify(id=${b['id']})}" method="post" class="m-0">
            <button class="btn btn-sm btn-outline-success" type="submit">Check eligibility</button>
        </form>
        <form th:action="@{/beneficiary/{id}/status(id=${b['id']})}" method="post" class="m-0">
            <input type="hidden" name="value" th:value="${b['status'] == 'ACTIVE'} ? 'INACTIVE' : 'ACTIVE'">
            <button class="btn btn-sm btn-outline-secondary" type="submit"
                    th:text="${b['status'] == 'ACTIVE'} ? 'Mark inactive' : 'Mark active'">Toggle</button>
        </form>
        <form th:action="@{/beneficiary/{id}/delete(id=${b['id']})}" method="post" class="m-0"
              sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Delete this beneficiary?');">
            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
        </form>
    </div>

    <table class="table table-sm table-bordered w-auto bg-white">
        <tbody>
        <tr><th>Type</th><td th:text="${b['type']}"></td></tr>
        <tr><th>Category</th><td th:text="${b['category']}"></td></tr>
        <tr><th>People served</th><td th:text="${b['peopleServed']}"></td></tr>
        <tr><th>Age</th><td th:text="${b['age']}"></td></tr>
        <tr><th>Gender</th><td th:text="${b['gender']}"></td></tr>
        <tr><th>Address</th><td th:text="${b['address']}"></td></tr>
        <tr><th>Contact</th><td th:text="${b['contactNumber']}"></td></tr>
        <tr><th>Household size</th><td th:text="${b['householdSize']}"></td></tr>
        <tr><th>Health condition</th><td th:text="${b['healthCondition']}"></td></tr>
        <tr><th>Dietary preference</th><td th:text="${b['dietaryPreference']}"></td></tr>
        <tr><th>Dietary restrictions</th><td th:text="${b['dietaryRestrictions']}"></td></tr>
        <tr><th>Status</th><td th:text="${b['status']}"></td></tr>
        <tr><th>Eligible</th><td th:text="${b['eligible'] == true} ? 'Yes' : 'No'"></td></tr>
        <tr><th>Eligibility notes</th><td th:text="${b['eligibilityNotes']}"></td></tr>
        <tr><th>Last verified</th><td th:text="${b['eligibilityVerifiedOn']}"></td></tr>
        <tr><th>Registered on</th><td th:text="${b['registeredOn']}"></td></tr>
        </tbody>
    </table>
</section>
</body>
</html>
